[workspace]
resolver = "2"
members = ["docs/probes", "samples/roughjs"]

# Div is pinned to one commit: bump `rev` in docs/probes/Cargo.toml and in
# this patch table together. The lock is seeded from Div's own Cargo.lock.
[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
read-fonts = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
font-types = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
bytemuck = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
bytemuck_derive = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
zbus_xml = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.skia-bindings]
opt-level = 3

[profile.release.package.skia-bindings]
opt-level = 3
