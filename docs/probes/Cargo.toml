[package]
name = "canvas-probes"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "Probes of what Div's public API allows for canvas today"
license = "Apache-2.0"

[[bin]]
name = "frame_loop"
path = "src/bin/frame_loop.rs"

# Div is pinned to one commit; bump `rev` here and in the patch table together.
# div-gap: the lock is seeded from Div's own Cargo.lock (sample-git gap 24).
[dependencies]
divui = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f", features = ["desktop"] }
# The same skia-safe Div links (patched below to Div's rust-skia rev), so an
# app can draw with Skia itself. divui does not re-export it.
skia-safe = "0.94"

[dev-dependencies]
divui = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f", features = ["testing"] }
